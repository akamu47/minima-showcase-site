<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<meta name="googlebot" content="noindex, nofollow" />
<title>Restricted</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Cpath d='M6 22 L10 10 L16 20 L22 10 L26 22' stroke='%232DD4BF' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0a0a0a;
    --ink: #f5f5f5;
    --muted: #8a8a8a;
    --teal: #2DD4BF;
    --line: rgba(245,245,245,0.12);
    --card: rgba(255,255,255,0.03);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }
  body {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(45,212,191,0.08), transparent 60%),
      radial-gradient(900px 500px at 90% 110%, rgba(45,212,191,0.05), transparent 60%),
      var(--bg);
    padding: 24px;
  }
  .gate {
    width: 100%; max-width: 440px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 40px 36px;
    backdrop-filter: blur(6px);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .brand svg { width: 26px; height: 26px; color: var(--teal); }
  .brand-text { font-family: 'Instrument Serif', serif; font-size: 22px; letter-spacing: 0.5px; }
  .brand-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-left: 4px; }
  h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 0 0 28px; }
  label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
  input[type="password"] {
    width: 100%; padding: 12px 14px;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font-family: 'Inter', sans-serif; font-size: 15px;
    outline: none; transition: border-color 0.15s;
  }
  input[type="password"]:focus { border-color: var(--teal); }
  button {
    width: 100%; margin-top: 16px; padding: 12px 14px;
    background: var(--teal); color: #0a0a0a;
    border: none; border-radius: 8px;
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
    letter-spacing: 0.3px; cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.9; }
  .err { color: #ff6b6b; font-size: 13px; margin-top: 12px; min-height: 18px; font-family: 'JetBrains Mono', monospace; }
  .foot { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
  <main class="gate" role="main">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M6 22 L10 10 L16 20 L22 10 L26 22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand-text">Minima</span>
      <span class="brand-sub">/ Trust Layer</span>
    </div>
    <h1>Restricted preview</h1>
    <p class="sub">This is an internal working site. Access is limited to the Minima team and collaborators. Enter the shared passphrase to continue.</p>
    <form id="gate-form" autocomplete="off">
      <label for="pw">Passphrase</label>
      <input type="password" id="pw" name="pw" autofocus autocomplete="off" spellcheck="false" />
      <button type="submit">Unlock</button>
      <div class="err" id="err" aria-live="polite"></div>
    </form>
    <div class="foot">Not for public distribution</div>
  </main>
<script>
(async function(){
  // If already unlocked in this session, go straight in
  try {
    if (sessionStorage.getItem('mshow_auth') === 'b66b89daf61656ceea1acd9476965dcd307a62302ff33a05f3730b75ca032cc1') {
      location.replace('site.html');
      return;
    }
  } catch(e) {}

  const EXPECTED = 'b66b89daf61656ceea1acd9476965dcd307a62302ff33a05f3730b75ca032cc1';
  const form = document.getElementById('gate-form');
  const pw = document.getElementById('pw');
  const err = document.getElementById('err');

  async function sha256(str){
    const buf = new TextEncoder().encode(str);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    const h = await sha256(pw.value);
    if (h === EXPECTED) {
      try { sessionStorage.setItem('mshow_auth', EXPECTED); } catch(e){}
      location.replace('site.html');
    } else {
      err.textContent = 'Incorrect passphrase.';
      pw.value = '';
      pw.focus();
    }
  });
})();
</script>
</body>
</html>
